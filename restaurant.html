  <link rel="stylesheet" href="style.css"/>

</head>

<body>

<!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Lo'<span>ma</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="new_meal.html">Fresh Meals</a></li>

      </ul>

  <section id="restaurant-form-section" class="form-section">
  <form class="returned-form">
    <h2>List a Returned Meal</h2>
    <p class="form-lead">
      Fill out the form below to add a new meal to the platform.
    </p>

    <div class="fields-row">
      <div class="form-group">
        <label>Restaurant Name</label>
        <input type="text" placeholder="The Corner Bistro" required />
      </div>
      <div class="form-group">
        <label>Meal Name</label>
        <input type="text" placeholder="e.g., Gourmet Burger" required />
      </div>
    </div>

   

    <div class="form-group">
  <label>Reason for Return</label>
  <select>
    <option value="">Select a reason...</option>
    <option>Incorrect Order</option>
    <option>Missing Items</option>
    <option>Late Delivery</option>
    <option>Cancellation</option>
    <option>Wrong Ingredients</option>
    <option>Cold food</option>
  </select>
</div>


    <div class="fields-row">
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" min="1" placeholder="e.g., 5" required />
      </div>
      <div class="form-group">
        <label>Discount %</label>
        <input type="number" min="0" max="100" placeholder="e.g., 50" required />
      </div>
      <div class="form-group">
        <label>Expiry Time</label>
        <input type="datetime-local" required />
      </div>
    </div>

    <div class="form-group">
      <label>Meal Image</label>
      <div class="image-upload">
        <label for="meal-img">
          <div class="upload-area">

            <span class="upload-text">
              <span style="color: #23cb6b;">Upload a file</span> or drag and drop<br>
              <span class="hint">PNG, JPG, GIF up to 10MB</span>
            </span>
          </div>
        </label>
        <input id="meal-img" type="file" accept="image/png,image/jpeg,image/gif" style="display:none" />
      </div>
    </div>
    <button class="submit-btn" type="submit">Submit for Review</button>
  </form>
</section>







<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
